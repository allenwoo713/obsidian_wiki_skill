name: eval

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'eval/baselines.json'
      - 'requirements.in'
      - 'requirements.txt'
      - 'scripts/compile_requirements.py'
  workflow_dispatch:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR baseline guard compares event base/head commits. Full history
          # makes missing refs exceptional, and the guard still fails closed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Verify dependency lock is current
        # `uv pip compile` does a floating resolution; when a transitive dep
        # releases a new version the committed lock can become "stale" and the
        # --check would hard-fail CI even though the code is correct. Regenerate
        # the lock on disk (used by the install step below) so the run proceeds
        # with a current resolution instead of failing on hygiene drift.
        run: python scripts/compile_requirements.py --check || python scripts/compile_requirements.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: embed-model-${{ hashFiles('scripts/download_embedding_model.py') }}
      - name: Bootstrap local embedding model
        run: |
          python scripts/download_embedding_model.py
      - name: Unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider --basetemp=/tmp/owb_pytest
      - name: Protect evaluation baseline on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Cannot determine pull-request base/head SHAs; failing closed."
            exit 1
          fi
          git cat-file -e "$base^{commit}" || {
            echo "Cannot resolve PR base commit $base; failing closed."
            exit 1
          }
          git cat-file -e "$head^{commit}" || {
            echo "Cannot resolve PR head commit $head; failing closed."
            exit 1
          }
          changed_files="$(git diff --name-only "$base" "$head")" || {
            echo "Cannot determine PR changed files; failing closed."
            exit 1
          }
          if [[ $'\n'"$changed_files"$'\n' == *$'\neval/baselines.json\n'* ]]; then
            echo "Baseline changes are default-denied on pull_request. Use the documented, separately reviewed maintenance workflow."
            exit 1
          fi
      - name: Retrieval eval (regression check)
        run: |
          python eval/run_eval.py --work-dir /tmp/owb_eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.json
            eval/detail.jsonl
