      - name: Materialize only the sealed generated hybrid dispatch bundle
        env:
          WORKFLOW_INPUTS: ${{ inputs.workflow_inputs }}
        run: >
          python -c "import json,os,pathlib; d=pathlib.Path('.review-tmp/phase07'); d.mkdir(parents=True,exist_ok=True); v=json.loads(os.environ['WORKFLOW_INPUTS']); (d/'hybrid-dispatch.json').write_text(json.dumps(v,sort_keys=True))"
