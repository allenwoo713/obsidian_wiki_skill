          --model-dir models/paraphrase-multilingual-MiniLM-L12-v2
      - name: Upload sealed frozen base, never a candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: phase07-frozen-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review-tmp/phase07/frozen-corpus
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

