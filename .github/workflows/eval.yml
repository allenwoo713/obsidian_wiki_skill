name: eval

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'eval/baselines.json'
      - 'requirements.in'
      - 'requirements.txt'
      - 'scripts/compile_requirements.py'
  workflow_dispatch:
    inputs:
      campaign_stage:
        description: "Typed, non-authorizing Phase 07 campaign stage"
        required: false
        default: preflight
        type: choice
        options: [preflight, screening, confirmation, hybrid-prepare, hybrid]
      workflow_inputs:
        description: "Sealed generated Phase 07 campaign dispatch bundle"
        required: false
        type: string

# Hosted jobs need only their checkout and immutable artifact reads.  No job
# receives write, package, deployment, or id-token authority.
permissions:
  contents: read
  actions: read

jobs:
  test-and-eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR baseline guard compares event base/head commits. Full history
          # makes missing refs exceptional, and the guard still fails closed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Configure repository-local caches and temporary paths
        run: |
          echo "PIP_CACHE_DIR=${{ github.workspace }}/.cache/pip" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=${{ github.workspace }}/.cache/uv" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ github.workspace }}/.review-tmp/eval" >> "$GITHUB_ENV"
          echo "TEMP=${{ github.workspace }}/.review-tmp/eval" >> "$GITHUB_ENV"
          echo "TMP=${{ github.workspace }}/.review-tmp/eval" >> "$GITHUB_ENV"
          mkdir -p .review-tmp/eval
      - name: Verify dependency lock is current
        run: python scripts/compile_requirements.py --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Report storage SDK versions
        run: >
          python -c "import importlib.metadata as metadata;
          print(', '.join(f'{package}={metadata.version(package)}' for package in
          ('lancedb', 'pyarrow', 'sentence-transformers')))"
      - name: Validate approved production ANN policy record (Phase 06)
        run: python -m eval.run_eval --validate-ann-policy
      # #17 API coverage: adapter call shapes, persisted real artifacts, exact-bypass
      # and ANN policy, SDK-free import boundaries, and installed-version reporting.
      # D-03 timing and resource values are recorded observations, never timing gates.
      - name: Run #17 LanceDB storage-contract and ANN-policy suites
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/phase01-contract
          tests/test_lancedb_storage_contract.py tests/test_ann_policy.py -q
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: embed-model-${{ hashFiles('scripts/download_embedding_model.py') }}
      - name: Bootstrap local embedding model
        run: |
          python scripts/download_embedding_model.py
      - name: Run Phase 07 frozen-base real-model tokenizer gate
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/phase07-frozen-model
          tests/test_phase07_frozen_model_contract.py -q
      # #22 must use the real storage/public facade after the existing local-model
      # bootstrap.  No baseline initialization or policy mutation is accepted.
      - name: Run #22 storage, recovery, telemetry, and public-route gates
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/phase04-online-incremental
          tests/test_online_incremental.py
          tests/test_online_incremental_policy.py
          tests/test_online_incremental_cli.py
          tests/test_online_incremental_eval.py -q
      - name: Run #22 public build-mode equivalence gate
        run: |
          set -euo pipefail
          python -m eval.compare_build_modes \
            --work-dir .review-tmp/phase04-modes \
            --output .review-tmp/phase04-modes/equivalence.json
          test -s .review-tmp/phase04-modes/equivalence.json
      - name: Run #39 production CLI real-model tail-recall gate
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/chunking-real-model
          tests/test_index_chunking_eval_contract.py -q
      # #43 citation contract is part of publication acceptance: a bundle that
      # cites a noncanonical path or gives a community report a fake page citation
      # is not publishable evidence.
      - name: Run publication, chunking, and bounded ANN benchmark acceptance gates
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/publication-acceptance
          tests/test_lancedb_storage_contract.py
          tests/test_index_safety_lock.py
          tests/test_index_durability.py
          tests/test_index_post_commit.py
          tests/test_test_suite_integrity.py
          tests/test_community_report_publication.py
          tests/test_index_chunking_contract.py
          tests/test_benchmark_sampling.py
          tests/test_benchmark_batch_exact.py
          tests/test_issue14_context_contract.py
          tests/test_community_reports.py
          tests/test_eval_workflow.py -q
      - name: Unit tests
        run: >
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/pytest
          --ignore=tests/test_phase07_frozen_model_contract.py
      - name: Protect evaluation baseline on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "Cannot determine pull-request base/head SHAs; failing closed."
            exit 1
          fi
          git cat-file -e "$base^{commit}" || {
            echo "Cannot resolve PR base commit $base; failing closed."
            exit 1
          }
          git cat-file -e "$head^{commit}" || {
            echo "Cannot resolve PR head commit $head; failing closed."
            exit 1
          }
          changed_files="$(git diff --name-only "$base" "$head")" || {
            echo "Cannot determine PR changed files; failing closed."
            exit 1
          }
          if [[ $'\n'"$changed_files"$'\n' == *$'\neval/baselines.json\n'* ]]; then
            echo "Baseline changes are default-denied on pull_request. Use the documented, separately reviewed maintenance workflow."
            exit 1
          fi
      - name: Retrieval eval (regression check)
        run: |
          python -m eval.run_eval --work-dir .review-tmp/eval
      - name: Bind #22 evidence to the accepted workflow inputs
        run: >
          python -c "import json, pathlib; root=pathlib.Path('.review-tmp/phase04-modes');
          evidence=json.loads((root/'equivalence.json').read_text(encoding='utf-8'));
          assert evidence['verdict'] == 'pass' and evidence['artifact_sha256'];
          (root/'acceptance.json').write_text(json.dumps({'head_sha':'${{ github.sha }}',
          'pr_head_sha':'${{ github.event.pull_request.head.sha }}',
          'run_id':'${{ github.run_id }}','artifact_sha256':evidence['artifact_sha256']},
          sort_keys=True) + '\\n', encoding='utf-8')"
      - name: Upload #22 equivalence and telemetry evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase04-build-mode-evidence
          path: |
            .review-tmp/phase04-modes/equivalence.json
            .review-tmp/phase04-modes/acceptance.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.json
            eval/detail.jsonl
          retention-days: 90

  issue41-manual-calibration:
    name: "Issue #41 manual ANN calibration (non-authorizing)"
    # Kept as a legacy Issue #41 diagnostic; it is not a Phase 07 campaign.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'legacy-issue41-calibration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ github.workspace }}/.review-tmp/issue41-scale
      TEMP: ${{ github.workspace }}/.review-tmp/issue41-scale
      TMP: ${{ github.workspace }}/.review-tmp/issue41-scale
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Create repository-local cache and temporary roots
        run: mkdir -p .cache/pip .cache/uv .review-tmp/issue41-scale
      - name: Verify dependency lock is current
        run: python scripts/compile_requirements.py --check
      - name: Install scale-benchmark dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Assert locked LanceDB, NumPy, and PyArrow runtime identity
        run: >
          python -c "import importlib.metadata as metadata, numpy;
          expected={'lancedb':'0.34.0', 'numpy':'2.2.6', 'pyarrow':'25.0.0'};
          actual={'lancedb':metadata.version('lancedb'), 'numpy':numpy.__version__,
          'pyarrow':metadata.version('pyarrow')}; print(actual);
          assert actual == expected, f'expected LanceDB 0.34.0 / NumPy 2.2.6 / PyArrow 25.0.0, got {actual}'"
      - name: Run manual non-authorizing OMP calibration and batch observation
        run: >
          python -m eval.benchmark_ann_build
          --rows 77348
          --dimensions 384
          --max-probes 256
          --ef-grid 30,50,75,100,150,200
          --candidates ivf-hnsw-flat,ivf-hnsw-sq
          --row-batch-size 8192
          --query-batch-size 32
          --max-exact-seconds 10
          --max-evidence-bytes 10485760
          --work-dir .review-tmp/issue41-scale
          --output .review-tmp/issue41-scale/calibration-never-accepting.json
          --error-output .review-tmp/issue41-scale/index-benchmark-error.json
          --calibrate
          --calibration-output .review-tmp/issue41-scale/ann-calibration.json
          --calibration-batch-output .review-tmp/issue41-scale/ann-calibration-batch-spike.json
      - name: Upload non-accepting OMP calibration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue41-ann-calibration
          path: .review-tmp/issue41-scale/ann-calibration.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload observational ANN calibration batch spike
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue41-ann-calibration-batch-spike
          path: .review-tmp/issue41-scale/ann-calibration-batch-spike.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload rejected issue #41 comparator error evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue41-index-benchmark-error
          path: .review-tmp/issue41-scale/index-benchmark-error.json
          if-no-files-found: ignore
          retention-days: 90

  issue41-scale-benchmark:
    name: "Issue #41 held-out ANN acceptance comparator (77,348 x 384)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: ${{ github.workspace }}/.review-tmp/issue41-scale
      TEMP: ${{ github.workspace }}/.review-tmp/issue41-scale
      TMP: ${{ github.workspace }}/.review-tmp/issue41-scale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Create repository-local cache and temporary roots
        run: mkdir -p .cache/pip .cache/uv .review-tmp/issue41-scale
      - name: Verify dependency lock is current
        run: python scripts/compile_requirements.py --check
      - name: Install scale-benchmark dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Assert locked LanceDB, NumPy, and PyArrow runtime identity
        run: >
          python -c "import importlib.metadata as metadata, numpy;
          expected={'lancedb':'0.34.0', 'numpy':'2.2.6', 'pyarrow':'25.0.0'};
          actual={'lancedb':metadata.version('lancedb'), 'numpy':numpy.__version__,
          'pyarrow':metadata.version('pyarrow')}; print(actual);
          assert actual == expected, f'expected LanceDB 0.34.0 / NumPy 2.2.6 / PyArrow 25.0.0, got {actual}'"
      - name: Require committed root/user-approved static calibration reference
        run: >
          python -c "import json, os, pathlib; path=pathlib.Path('eval/approved_ann_calibration.json');
          assert path.is_file(), 'missing committed root/user-approved calibration reference';
          value=json.loads(path.read_text()); required=('static_cap_seconds','calibration_sha256','calibration_rule_version','omp_threads');
          assert all(value.get(key) is not None for key in required), 'incomplete committed calibration reference';
          assert len(value['calibration_sha256']) == 64, 'invalid committed calibration digest';
          assert value['static_cap_seconds'] == 180, 'approved per-build cap must remain 180 seconds';
          assert value['omp_threads'] == 2, 'approved OMP setting must remain 2';
          env=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8');
          [print(f'ANN_APPROVED_{key.upper()}={value[key]}', file=env) for key in required]; env.close()"
      - name: Validate approved production ANN policy record (Phase 06)
        run: python -m eval.run_eval --validate-ann-policy
      - name: Run static-cap held-out FLAT/SQ ANN acceptance comparator
        env:
          # Bind native thread pools to the approved calibration setting so the
          # held-out run uses the same normal per-query ANN execution regime.
          OMP_NUM_THREADS: ${{ env.ANN_APPROVED_OMP_THREADS }}
          OPENBLAS_NUM_THREADS: ${{ env.ANN_APPROVED_OMP_THREADS }}
          MKL_NUM_THREADS: ${{ env.ANN_APPROVED_OMP_THREADS }}
        run: >
          python -m eval.benchmark_ann_build
          --rows 77348
          --dimensions 384
          --max-probes 256
          --ef-grid 30,50,75,100,150,200
          --candidates ivf-hnsw-flat,ivf-hnsw-sq
          --row-batch-size 8192
          --query-batch-size 32
          --max-exact-seconds 10
          --per-build-cap-seconds 180
          --max-evidence-bytes 10485760
          --work-dir .review-tmp/issue41-scale
          --output eval/index-benchmark.json
          --error-output .review-tmp/issue41-scale/index-benchmark-error.json
      - name: Upload issue #41 held-out scale evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue41-index-benchmark
          path: eval/index-benchmark.json
          retention-days: 90
      - name: Upload rejected issue #41 comparator error evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue41-index-benchmark-error
          path: .review-tmp/issue41-scale/index-benchmark-error.json
          if-no-files-found: ignore
          retention-days: 90

  model-backed-ann-decision:
    name: "Model-backed candidate-specific hybrid decision records"
    if: github.event_name == 'pull_request'
    needs: issue41-scale-benchmark
    runs-on: ubuntu-latest
    env:
      GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Download complete held-out comparator evidence
        uses: actions/download-artifact@v4
        with:
          name: issue41-index-benchmark
          path: .review-tmp/held-out-evidence
      - name: Validate comparator evidence before model bootstrap
        run: python -m eval.benchmark_ann_build --validate-evidence .review-tmp/held-out-evidence/index-benchmark.json
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: embed-model-${{ hashFiles('scripts/download_embedding_model.py') }}
      - name: Bootstrap local embedding model
        run: python scripts/download_embedding_model.py
      - name: Run model-backed candidate decision records without baseline refresh
        run: >
          python -m eval.run_eval
          --work-dir .review-tmp/model-backed-ann
          --decision-evidence .review-tmp/held-out-evidence/index-benchmark.json
          --decision-output eval/candidate-hybrid-ann-decision.json
      - name: Validate all twelve candidate-specific production hybrid records
        run: >
          python -m eval.run_eval
          --decision-evidence .review-tmp/held-out-evidence/index-benchmark.json
          --validate-candidate-hybrid-evidence eval/candidate-hybrid-ann-decision.json
      - name: Upload model-backed candidate decision records
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-hybrid-ann-decision
          path: |
            eval/candidate-hybrid-ann-decision.json
            eval/results.json
            eval/detail.jsonl
          retention-days: 90
      - name: Upload rejected candidate-hybrid diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-hybrid-ann-decision-error
          path: |
            eval/results.json
            eval/detail.jsonl
          if-no-files-found: ignore
          retention-days: 90

  reconcile-ann-decision:
    name: "Eval ANN decision reconciliation"
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: [test-and-eval, issue41-scale-benchmark, model-backed-ann-decision]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify dependency lock is current
        if: ${{ always() }}
        run: python scripts/compile_requirements.py --check
      - name: Install locked reconciliation dependencies
        if: ${{ always() }}
        run: python -m pip install -r requirements.txt pytest
      - name: Download scale evidence for validation
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: issue41-index-benchmark
          path: .review-tmp/reconcile/scale
      - name: Download model-backed records for validation
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-hybrid-ann-decision
          path: .review-tmp/reconcile/model
      - name: Reconcile numeric same-head Eval evidence
        if: ${{ always() }}
        run: >
          python -m eval.reconcile_ann_gate
          --scale-evidence .review-tmp/reconcile/scale/index-benchmark.json
          --model-records .review-tmp/reconcile/model/candidate-hybrid-ann-decision.json
          --test-and-eval "${{ needs.test-and-eval.result }}"
          --scale "${{ needs.issue41-scale-benchmark.result }}"
          --model-backed "${{ needs.model-backed-ann-decision.result }}"
          --expected-head "${{ github.sha }}"
          --expected-pr-head "${{ github.event.pull_request.head.sha }}"
          --output .review-tmp/reconcile/ann-reconciliation.json
      - name: Upload reconciliation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ann-decision-reconciliation
          path: .review-tmp/reconcile/ann-reconciliation.json
          if-no-files-found: warn
          retention-days: 90
      - name: Required cross-workflow PR checks
        if: ${{ always() }}
        run: |
          echo "Configure branch protection for:"
          echo "Architecture (ubuntu-latest, Python 3.10)"
          echo "Architecture (ubuntu-latest, Python 3.13)"
          echo "Architecture (windows-latest, Python 3.10)"
          echo "Architecture (windows-latest, Python 3.13)"

  # Preflight never installs/imports the numeric stack, hydrates a model, or runs a campaign.
  # Both legs are required evidence; either rejection blocks all later manual stages.
  phase07-entitlement-preflight-ubuntu:
    name: "Phase 07 hosted entitlement preflight (non-authorizing)"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Seal stdlib-only preflight success or rejection without dependency import
        env:
          PHASE07_STAGE: ${{ inputs.campaign_stage }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: >
          python -m eval.phase07_operator_gate hosted-preflight --ledger-file .review-tmp/phase07-preflight/success-or-rejection.json --stage "$PHASE07_STAGE" --repository "$REPOSITORY" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --head-sha "$HEAD_SHA" --job-key phase07-entitlement-preflight-ubuntu --runner-os "$RUNNER_OS" --runner-architecture "$RUNNER_ARCH"
      - name: Upload preflight evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase07-preflight-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review-tmp/phase07-preflight/success-or-rejection.json
          if-no-files-found: error
          retention-days: 90

  phase07-entitlement-preflight-windows:
    name: "Phase 07 hosted entitlement preflight (Windows, non-authorizing)"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'preflight' }}
    runs-on: windows-latest
    timeout-minutes: 8
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Seal stdlib-only Windows preflight success or rejection
        shell: pwsh
        env:
          PHASE07_STAGE: ${{ inputs.campaign_stage }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: >
          python -m eval.phase07_operator_gate hosted-preflight --ledger-file .review-tmp/phase07-preflight/success-or-rejection.json --stage "$env:PHASE07_STAGE" --repository "$env:REPOSITORY" --run-id "$env:RUN_ID" --run-attempt "$env:RUN_ATTEMPT" --head-sha "$env:HEAD_SHA" --job-key phase07-entitlement-preflight-windows --runner-os "$env:RUNNER_OS" --runner-architecture "$env:RUNNER_ARCH"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: phase07-preflight-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review-tmp/phase07-preflight/success-or-rejection.json
          if-no-files-found: error
          retention-days: 90

  phase07-screening:
    name: "Phase 07 bounded SQ screening campaign"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'screening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, actions: read}
    env: {OMP_NUM_THREADS: '2', OPENBLAS_NUM_THREADS: '2', MKL_NUM_THREADS: '2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact numeric dependencies and validate model cache before import
        run: python -m pip install -r requirements.txt pytest
      - name: Validate immutable model manifest for seeded numeric screening
        run: python scripts/download_embedding_model.py --validate-manifest-only
      - name: Assert actual locked Stage 1 runtime and OMP settings
        run: >
          python -c "import importlib.metadata as metadata, os, sys;
          expected={'python':'3.13', 'lancedb':'0.34.0', 'numpy':'2.2.6', 'pyarrow':'25.0.0'};
          actual={'python':f'{sys.version_info.major}.{sys.version_info.minor}', 'lancedb':metadata.version('lancedb'), 'numpy':metadata.version('numpy'), 'pyarrow':metadata.version('pyarrow')};
