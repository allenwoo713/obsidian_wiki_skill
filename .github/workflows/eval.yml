name: eval

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'requirements.in'
      - 'requirements.txt'
      - 'scripts/compile_requirements.py'
  workflow_dispatch:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: astral-sh/setup-uv@v6
      - name: Verify dependency lock is current
        run: python scripts/compile_requirements.py --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: embed-model-${{ hashFiles('scripts/download_embedding_model.py') }}
      - name: Bootstrap local embedding model
        # PR #24 changed the embedder to local-first (no HuggingFace fallback),
        # so the weight file must exist before any test that builds a real index.
        # download_embedding_model.py is a no-op if the model is already present
        # (e.g. warm CI cache), otherwise it pulls it via ModelScope.
        run: |
          python scripts/download_embedding_model.py
      - name: Unit tests
        run: |
          pytest -p no:cacheprovider --basetemp=/tmp/owb_pytest
      - name: Retrieval eval (regression check)
        run: |
          python eval/run_eval.py --work-dir /tmp/owb_eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.json
            eval/detail.jsonl
