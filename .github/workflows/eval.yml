  phase07-reconciliation:
    name: "Phase 07 immutable evidence reconciliation"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'reconciliation' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Create strict reconciliation binding from supplied operator packet
        env:
          BINDING: ${{ inputs.continuation_binding }}
        run: python -c "import json,os,pathlib; p=json.loads(os.environ['BINDING']); assert set(p)=={'repository','head_sha','packets'}; d=pathlib.Path('.review-tmp/phase07/reconciliation-input'); d.mkdir(parents=True,exist_ok=True); (d/'binding.json').write_text(json.dumps(p,sort_keys=True))"
      - name: Reconcile supplied immutable hosted packet set
        run: python eval/phase07_operator_gate.py reconcile-hosted --request-file .review-tmp/phase07/reconciliation-input/binding.json --ledger-file .review-tmp/phase07/reconciliation-artifacts
      - name: Emit reconciliation rejection only if output is missing
        if: ${{ always() }}
        run: python eval/phase07_operator_gate.py finalize --output-dir .review-tmp/phase07/reconciliation-artifacts --stage reconciliation --head-sha "${{ github.sha }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --job-key phase07-reconciliation --job-status "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: phase07-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .review-tmp/phase07/reconciliation-artifacts
          if-no-files-found: error
          retention-days: 90

  phase07-pr-acceptance-gate:
    name: "Phase 07 same-head policy migration gate"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Deterministically skip non-policy PRs and fail closed for policy migration
        run: |
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          if ! printf '%s\n' "$changed" | grep -Eq '^(eval/ann-policy\.json|scripts/obsidian_wiki/domain/index_policy\.py)$'; then exit 0; fi
          echo 'Policy migration requires Plan 09 same-head baseline/finalist artifact bindings.' >&2
          exit 1
