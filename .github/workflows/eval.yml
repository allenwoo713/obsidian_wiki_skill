  phase07-hybrid-prepare:
    name: "Phase 07 candidate-neutral frozen corpus prepare"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign_stage == 'hybrid-prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read, actions: read}
    env: {OMP_NUM_THREADS: "2", OPENBLAS_NUM_THREADS: "2", MKL_NUM_THREADS: "2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - id: phase07-model-cache
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: phase07-model-${{ hashFiles('eval/model-manifest.json', 'scripts/download_embedding_model.py') }}
      - name: Install exact numeric dependencies and validate the pinned local model
        run: python -m pip install -r requirements.txt pytest
      - name: Hydrate exact immutable model only on cache miss
        if: steps.phase07-model-cache.outputs.cache-hit != 'true'
        run: python scripts/download_embedding_model.py
      - name: Validate immutable cached model tree
        run: python -c "from pathlib import Path; from eval.ann_corpus_manifest import load_manifest,validate_model_tree; validate_model_tree(Path('models/paraphrase-multilingual-MiniLM-L12-v2'),load_manifest(Path('eval/model-manifest.json')))"
      - name: Materialize only the sealed prepare bundle
        env:
          WORKFLOW_INPUTS: ${{ inputs.workflow_inputs }}
        run: >
          python -c "import json,os,pathlib; d=pathlib.Path('.review-tmp/phase07'); d.mkdir(parents=True,exist_ok=True); (d/'prepare-bundle.json').write_text(json.dumps(json.loads(os.environ['WORKFLOW_INPUTS']),sort_keys=True))"
      - name: Materialize the fixed candidate-neutral 30k corpus
        run: >
          python -c "from pathlib import Path; from eval.run_eval import FIXTURES_WIKI,_materialize_phase07_expanded_corpus; _materialize_phase07_expanded_corpus(fixture_root=FIXTURES_WIKI,output_root=Path('.review-tmp/phase07/frozen-corpus/Wiki'),target_size=30000)"
      - name: Prepare and seal only reusable source data
        run: >
