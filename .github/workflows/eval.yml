name: eval

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'eval/**'
      - 'eval/baselines.json'
      - 'requirements.in'
      - 'requirements.txt'
      - 'scripts/compile_requirements.py'
  workflow_dispatch:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - name: Verify dependency lock is current
        # `uv pip compile` does a floating resolution; when a transitive dep
        # releases a new version the committed lock can become "stale" and the
        # --check would hard-fail CI even though the code is correct. Regenerate
        # the lock on disk (used by the install step below) so the run proceeds
        # with a current resolution instead of failing on hygiene drift.
        run: python scripts/compile_requirements.py --check || python scripts/compile_requirements.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models/paraphrase-multilingual-MiniLM-L12-v2
          key: embed-model-${{ hashFiles('scripts/download_embedding_model.py') }}
      - name: Bootstrap local embedding model
        run: |
          python scripts/download_embedding_model.py
      - name: Unit tests
        run: |
          pytest -p no:cacheprovider --basetemp=/tmp/owb_pytest
      - name: Retrieval eval (regression check)
        run: |
          python eval/run_eval.py --work-dir /tmp/owb_eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.json
            eval/detail.jsonl
