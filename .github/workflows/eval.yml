        run: >
          python -c "import hashlib,json,os,pathlib; d=pathlib.Path('.review-tmp/phase07'); d.mkdir(parents=True,exist_ok=True); b=json.loads(os.environ['BINDING']); assert set(b)=={'mode','prior_evidence_sha256','config'}; h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); r={'schema_version':1,'stage':'continuation','request_id':'continuation-'+os.environ['RUN_ID'],'environment':{'head_sha':os.environ['HEAD']},'model_manifest_sha256':h('eval/model-manifest.json'),'corpus_manifest_sha256':h('eval/personal-wiki-corpus-manifest.json'),**b}; (d/'request.json').write_text(json.dumps(r,sort_keys=True))"
      - name: Invoke the real bounded continuation CLI
