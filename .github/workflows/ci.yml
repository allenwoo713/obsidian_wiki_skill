name: CI

on:
  push:
    branches: [master]
  pull_request:
    # 对所有分支的 PR 触发 CI（默认行为），包括 base 非 master 的链式 PR（如 #33 基于 #32 分支）

jobs:
  health-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv
          # 轻量依赖：只装 import 健康检查需要的
          # 重型依赖（lancedb / sentence-transformers / torch）不在 CI 验证范围
          # 它们的 import 在实际使用时由 _get_embedder/_get_lance 惰性加载

      - name: Syntax check (compile all .py)
        run: |
          find scripts -name "*.py" -exec python -m py_compile {} +
          echo "All scripts compile OK"

      - name: Import health check (_config + models)
        run: |
          cd scripts
          python -c "import _config; print(f'SKILL_DIR={_config.SKILL_DIR}')"
          python -c "from models import WikiPage, RetrievedPage, ManifestEntry; print('models import OK')"
          python -c "from parsers.utils import slugify, image_filename, attach_captions; print('parsers.utils import OK')"

      - name: Verify .env not tracked
        run: |
          if git ls-files | grep -q '^\.env$'; then
            echo "ERROR: .env is tracked in git!"
            exit 1
          fi
          echo ".env is not tracked (OK)"

      - name: Verify no hardcoded sensitive paths
        run: |
          # 检查脚本中不应出现本机用户名或绝对路径（应使用占位符或 env）
          if grep -rE "C:\\\\Users\\\\[^<]" scripts/ --include="*.py"; then
            echo "WARNING: found hardcoded Windows user paths in scripts/"
            exit 1
          fi
          echo "No hardcoded sensitive paths (OK)"

      - name: Verify .env.example has all required keys
        run: |
          for key in MINERU_API_TOKEN MINERU_PYTHON_EXE MINERU_PDF_SENSITIVE WIKI_VENV_PYTHON WIKI_EMBEDDER_LOCAL_PATH HF_ENDPOINT; do
            if ! grep -q "^$key=" .env.example; then
              echo "ERROR: $key missing from .env.example"
              exit 1
            fi
          done
          echo "All required keys present in .env.example (OK)"

  architecture:
    name: Architecture (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PYTHONDONTWRITEBYTECODE: "1"
      TEMP: ${{ github.workspace }}/.review-tmp/architecture
      TMP: ${{ github.workspace }}/.review-tmp/architecture

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"

      - name: Verify dependency lock is current
        run: python scripts/compile_requirements.py --check

      - name: Install storage and architecture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest import-linter==2.13

      - name: Report storage SDK versions
        run: >
          python -c "import importlib.metadata as metadata;
          print(', '.join(f'{package}={metadata.version(package)}' for package in
          ('lancedb', 'pyarrow', 'sentence-transformers')))"

      - name: Create repository-local test temporary root
        run: python -c "from pathlib import Path; Path('.review-tmp').mkdir(exist_ok=True)"

      # #17 API coverage: adapter call shapes, persisted real artifacts, exact-bypass
      # and ANN policy, SDK-free import boundaries, and installed-version reporting.
      # D-03 timing and resource values are recorded observations, never timing gates.
      # #21/#34-#37 publication safety: real storage ordering, durable pointer primitives,
      # lifecycle/post-commit crash windows, deterministic process tests, and test integrity.
      # #39 model-free gates: planning is lock-scoped, manifest pages stay canonical,
      # parser semantics match WikiIndex, and persisted dense leaves remain token-bounded.
      # #41 bounded ANN benchmark: deterministic portable probes, versioned evidence,
      # explicit policy scope, observer parity, and a real >256-row publication path.
      # #43 citation contract: ContextItem.path must be Wiki-relative posix on every
      # platform — this suite is the OS-sensitive gate (Windows separators/abs paths),
      # canonical spelling, and Global Search's text/JSON report renderers.
      # All named suites are model-free and must pass on Windows + Linux.
      - name: Run storage, publication, chunking, and ANN benchmark acceptance gates
        run: >
          python -m pytest -p no:cacheprovider
          --basetemp=.review-tmp/phase01-contract
          tests/test_lancedb_storage_contract.py
          tests/test_ann_policy.py
          tests/test_index_safety_lock.py
          tests/test_index_durability.py
          tests/test_index_post_commit.py
          tests/test_test_suite_integrity.py
          tests/test_index_chunking_contract.py
          tests/test_benchmark_sampling.py
          tests/test_benchmark_batch_exact.py
          tests/test_issue14_context_contract.py
          tests/test_sparse_structure_contract.py
          tests/test_fusion.py
          tests/test_community_reports.py
          tests/test_eval_workflow.py -q

      - name: Enforce package import contracts
        working-directory: scripts
        run: lint-imports --config ../.importlinter --no-cache

      - name: Run architecture compatibility regression
        run: python tests/test_architecture_foundation.py
