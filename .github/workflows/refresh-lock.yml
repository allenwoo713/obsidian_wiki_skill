name: Refresh dependency lock (temp)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch to refresh requirements.txt lock on"
        required: true
        default: "agent/fix-issues-14-15"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Regenerate requirements lock
        run: python scripts/compile_requirements.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.txt
          if git diff --cached --quiet; then
            echo "lock already current; nothing to commit"
          else
            git commit -m "chore(deps): refresh requirements lock via uv [ci temp]"
            git push origin HEAD:${{ github.event.inputs.target_ref }}
          fi
